[project]
name = "scidev-harness"
version = "0.1.0"
description = "A local-first desktop coding harness for research workflows."
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Environment :: Win32 (MS Windows)",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = ["PySide6-Essentials>=6.11,<7", "pywinpty>=3.0; sys_platform == 'win32'", "jedi>=0.19"]

[tool.pyside6-project]
files = [
    "scidev/desktop/client.py",
    "scidev/desktop/chat_workflow.py",
    "scidev/desktop/terminal_workspace.py",
    "scidev/desktop/explorer_workspace.py",
    "scidev/desktop/git_workspace.py",
    "scidev/desktop/window_layout.py",
    "scidev/desktop/agent_panel.py",
    "scidev/desktop/window_builders.py",
    "scidev/desktop/agent_settings.py",
    "scidev/agent/core.py",
    "scidev/agent/run.py",
    "scidev/agent/tools.py",
    "scidev/agent/summary.py",
    "scidev/agent/completion.py",
    "scidev/integrations/model.py",
    "scidev/agent/session.py",
    "scidev/agent/project_settings.py",
    "scidev/agent/toolbox.py",
    "scidev/integrations/svg.py",
    "scidev/agent/research.py",
    "scidev/desktop/editor_workspace.py",
    "scidev/workspace/git.py",
    "scidev/runtime/paths.py",
    "scidev/runtime/process.py",
    "scidev/agent/acceptance.py",
    "scidev/agent/usage.py",
    "scidev/workspace/context.py",
    "scidev/workspace/environment.py",
    "scidev/workspace/patching.py",
    "scidev/agent/memory.py",
    "scidev/agent/multi_agent.py",
    "scidev/agent/planning.py",
    "scidev/agent/verification.py",
    "scidev/integrations/browser.py",
    "scidev/desktop/icons.py",
    "scidev/desktop/theme.py",
    "scidev/runtime/preferences.py",
    "scidev/desktop/settings.py",
    "scidev/desktop/highlighting.py",
    "scidev/runtime/sandbox.py",
    "scidev/workspace/debug.py",
    "scidev/desktop/update_ui.py",
    "scidev/agent/tool_schema.py",
    "scidev/agent/tool_registry.py",
    "scidev/runtime/filelock.py",
    "scidev/runtime/helpers.py",
    "scidev/runtime/ledger.py",
    "scidev/runtime/queue.py",
    "scidev/integrations/mcp_server.py",
    "ui/qml/DevelopmentTree.qml",
    "ui/icons/chevron-down.svg",
    "ui/icons/chevron-up.svg",
]

[tool.ruff]
target-version = "py312"
line-length = 120
cache-dir = ".tmp-tests/cache/ruff"
extend-exclude = [".research", ".venv", ".tmp-tests", "examples", "deployment"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
"tests/*.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
cache_dir = ".tmp-tests/cache/mypy"
ignore_missing_imports = true
follow_imports = "skip"
files = [
    "scidev/runtime/process.py",
    "scidev/workspace/git.py",
    "scidev/runtime/paths.py",
    "scidev/agent/usage.py",
    "scidev/runtime/policy.py",
    "scidev/integrations/pr.py",
    "scidev/runtime/migrations.py",
    "scidev/evaluation/runner.py",
    "scidev/workspace/worktree.py",
    "scidev/integrations/mcp.py",
    "scidev/desktop/settings.py",
    "scidev/workspace/intel.py",
    "scidev/runtime/credentials.py",
    "scidev/integrations/update.py",
    "scidev/runtime/crash.py",
    "scidev/desktop/worktree_ui.py",
    "scidev/runtime/errors.py",
    "scidev/integrations/lsp.py",
    "scidev/desktop/lsp_ui.py",
    "scidev/desktop/patch_ui.py",
    "scidev/desktop/chat_ui.py",
    "scidev/desktop/plan_ui.py",
    "scidev/desktop/widgets.py",
    "scidev/desktop/tree_ui.py",
    "scidev/desktop/shell_ui.py",
    "scidev/desktop/editor.py",
    "scidev/desktop/mcp_ui.py",
    "scidev/evaluation/analytics.py",
    "scidev/desktop/analytics_ui.py",
    "scidev/desktop/pr_ui.py",
    "scidev/runtime/sandbox.py",
    "scidev/workspace/debug.py",
    "scidev/desktop/update_ui.py",
    "scidev/agent/tool_schema.py",
    "scidev/agent/tool_registry.py",
    "scidev/runtime/filelock.py",
    "scidev/runtime/helpers.py",
    "scidev/runtime/ledger.py",
    "scidev/runtime/queue.py",
    "scidev/integrations/mcp_server.py",
]

[tool.coverage.run]
branch = true
include = ["scidev/**/*.py"]

[tool.coverage.report]
fail_under = 40
skip_empty = true

[tool.pytest.ini_options]
cache_dir = ".tmp-tests/cache/pytest"
