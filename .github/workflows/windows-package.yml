name: Windows Package Verification

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build-standalone:
    runs-on: windows-2022
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate release tag matches APP_VERSION
        if: ${{ github.ref_type == 'tag' }}
        shell: pwsh
        run: |
          $versionLine = Select-String -Path "scidev_update.py" -Pattern '^APP_VERSION = "([^"]+)"'
          if (-not $versionLine) { throw "APP_VERSION was not found in scidev_update.py" }
          $version = $versionLine.Matches[0].Groups[1].Value
          $expected = "v$version"
          if ($env:GITHUB_REF_NAME -ne $expected) {
            throw "Release tag $env:GITHUB_REF_NAME does not match APP_VERSION ($expected)."
          }

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Prepare packaging environment
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -r requirements.txt -r requirements-build.txt

      - name: Verify minimal Qt runtime
        run: .\.venv\Scripts\python.exe scripts\verify_minimal_qt.py

      - name: Stage release inputs outside the checkout
        run: .\scripts\stage_release.ps1 -Destination "$env:RUNNER_TEMP\scidev-package-stage"

      - name: Build standalone package with MSVC
        shell: cmd
        working-directory: ${{ runner.temp }}\scidev-package-stage
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath`) do set "VSINSTALL=%%i"
          if not defined VSINSTALL exit /b 1
          call "%VSINSTALL%\VC\Auxiliary\Build\vcvars64.bat"
          if errorlevel 1 exit /b 1
          set "PATH=%GITHUB_WORKSPACE%\.venv\Scripts;%PATH%"
          set "VIRTUAL_ENV=%GITHUB_WORKSPACE%\.venv"
          "%GITHUB_WORKSPACE%\.venv\Scripts\pyside6-deploy.exe" --config-file pysidedeploy.spec --nuitka-version=4.1.1
          if errorlevel 1 exit /b 1

      - name: Smoke-test standalone executable and write a build manifest
        shell: pwsh
        run: |
          $deployment = Join-Path $env:RUNNER_TEMP "scidev-package-stage\deployment"
          $executables = @(Get-ChildItem -LiteralPath $deployment -Filter "scidev_client.exe" -File -Recurse)
          if ($executables.Count -ne 1) {
            throw "Expected one standalone scidev_client.exe; found $($executables.Count)."
          }
          $qmlFiles = @(Get-ChildItem -LiteralPath $deployment -Filter "DevelopmentTree.qml" -File -Recurse)
          if ($qmlFiles.Count -lt 1) {
            throw "The standalone package is missing DevelopmentTree.qml."
          }
          $applicationDirectory = Split-Path -Parent $executables[0].FullName
          & "$env:GITHUB_WORKSPACE\scripts\copy_default_sample.ps1" -ApplicationDirectory $applicationDirectory
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:QT_QUICK_BACKEND = "software"
          & $executables[0].FullName --smoke-test
          if ($LASTEXITCODE -ne 0) {
            throw "Packaged executable failed its Qt/QML startup smoke test (exit $LASTEXITCODE)."
          }
          $manifestPath = Join-Path $env:RUNNER_TEMP "SciDevHarness-Windows-x64-build-manifest.json"
          $python = Join-Path $env:GITHUB_WORKSPACE ".venv\Scripts\python.exe"
          $auditScript = Join-Path $env:GITHUB_WORKSPACE "scripts\audit_standalone.py"
          $sitePackages = Join-Path $env:GITHUB_WORKSPACE ".venv\Lib\site-packages"
          & $python $auditScript `
            --deployment $deployment `
            --site-packages $sitePackages `
            --output $manifestPath `
            --python-version "3.14" `
            --pyside-version "6.11.2" `
            --nuitka-version "4.1.1"
          if ($LASTEXITCODE -ne 0) {
            throw "Standalone runtime/license inventory failed (exit $LASTEXITCODE)."
          }

      - name: Install Inno Setup 6
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Import optional signing certificate
        shell: pwsh
        env:
          WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_SIGNING_PFX_BASE64) {
            Write-Output "No WINDOWS_SIGNING_PFX_BASE64 secret; the installer will be unsigned."
            exit 0
          }
          if (-not $env:WINDOWS_SIGNING_PFX_PASSWORD) {
            throw "WINDOWS_SIGNING_PFX_BASE64 is set but WINDOWS_SIGNING_PFX_PASSWORD is empty."
          }
          $pfxPath = Join-Path $env:RUNNER_TEMP "scidev-signing.pfx"
          try {
            [IO.File]::WriteAllBytes(
              $pfxPath,
              [Convert]::FromBase64String($env:WINDOWS_SIGNING_PFX_BASE64)
            )
            $password = ConvertTo-SecureString $env:WINDOWS_SIGNING_PFX_PASSWORD -AsPlainText -Force
            $imported = @(Import-PfxCertificate -FilePath $pfxPath -Password $password -CertStoreLocation "Cert:\CurrentUser\My")
            if ($imported.Count -lt 1) { throw "No certificate was imported from the PFX." }
            "SCIDEV_SIGN_THUMBPRINT=$($imported[0].Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append
            Write-Output "Imported signing certificate $($imported[0].Thumbprint)."
          }
          finally {
            Remove-Item -LiteralPath $pfxPath -Force -ErrorAction SilentlyContinue
          }

      - name: Build per-user installer
        shell: pwsh
        run: |
          $deployment = Join-Path $env:RUNNER_TEMP "scidev-package-stage\deployment"
          if (-not (Test-Path -LiteralPath $deployment -PathType Container)) {
            throw "Standalone deployment is missing: $deployment"
          }
          $versionLine = Select-String -Path "$env:GITHUB_WORKSPACE\scidev_update.py" -Pattern '^APP_VERSION = "([^"]+)"'
          if (-not $versionLine) { throw "APP_VERSION was not found in scidev_update.py" }
          $version = $versionLine.Matches[0].Groups[1].Value
          $installerDir = Join-Path $env:RUNNER_TEMP "scidev-installer"
          $buildArgs = @{
            Deployment = $deployment
            Version = $version
            OutputDirectory = $installerDir
          }
          $signThumbprint = $env:SCIDEV_SIGN_THUMBPRINT
          if ($signThumbprint) { $buildArgs.SignThumbprint = $signThumbprint }
          & "$env:GITHUB_WORKSPACE\scripts\build_installer.ps1" @buildArgs
          if ($LASTEXITCODE -ne 0) { throw "Installer build failed (exit $LASTEXITCODE)" }
          $installer = Join-Path $installerDir "SciDevHarness-Setup-$version.exe"
          if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) {
            throw "Expected installer was not produced: $installer"
          }
          $manifest = [pscustomobject]@{
            version = $version
            path = $installer
            bytes = (Get-Item -LiteralPath $installer).Length
            sha256 = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
            signed = [bool]$signThumbprint
          }
          $manifestPath = Join-Path $env:RUNNER_TEMP "SciDevHarness-Windows-x64-installer.json"
          $manifest | ConvertTo-Json | Set-Content -LiteralPath $manifestPath -Encoding utf8
          $manifest | ConvertTo-Json -Compress

      - name: Remove signing certificate
        if: always()
        shell: pwsh
        run: |
          $thumbprint = $env:SCIDEV_SIGN_THUMBPRINT
          if (-not $thumbprint) { exit 0 }
          Remove-Item -LiteralPath "Cert:\CurrentUser\My\$thumbprint" -Force -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SciDevHarness-Windows-x64-installer
          path: |
            ${{ runner.temp }}\scidev-installer\SciDevHarness-Setup-*.exe
            ${{ runner.temp }}\SciDevHarness-Windows-x64-installer.json
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SciDevHarness-Windows-x64-build-manifest
          path: ${{ runner.temp }}\SciDevHarness-Windows-x64-build-manifest.json
          if-no-files-found: error
          retention-days: 7
