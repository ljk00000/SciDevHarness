name: Windows CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * 1"

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Create project environment
        run: python -m venv .venv

      - name: Install dependencies
        run: |
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -r requirements.txt

      - name: Verify minimal Qt runtime
        run: .\.venv\Scripts\python.exe scripts\verify_minimal_qt.py

      - name: Verify the Windows launcher preflight
        run: .\start_client.bat --check-runtime

      - name: Run tests
        run: .\.venv\Scripts\python.exe -m unittest discover -s tests -v

      - name: Compile Python modules
        run: .\.venv\Scripts\python.exe -m py_compile scidev_client.py scidev_core.py scripts\audit_standalone.py scripts\bootstrap.py scripts\smoke_local_ollama.py scripts\verify_minimal_qt.py tests\test_client.py tests\test_core.py tests\test_bootstrap.py tests\test_local_ollama_smoke.py tests\test_package_audit.py tests\test_release_staging.py smoke_dependency.py

      - name: Check installed dependencies
        run: .\.venv\Scripts\python.exe -m pip check

      - name: Smoke-test dependencies
        run: .\.venv\Scripts\python.exe smoke_dependency.py

      - name: Render IDE and version-tree layouts
        run: .\.venv\Scripts\python.exe smoke_screenshot.py --output-dir "$env:RUNNER_TEMP\scidev-ui-shots"

      - name: Render IDE layouts at 125% DPI scale
        env:
          QT_SCALE_FACTOR: "1.25"
        run: .\.venv\Scripts\python.exe smoke_screenshot.py --output-dir "$env:RUNNER_TEMP\scidev-ui-shots-125dpi"

      - name: Lint QML
        run: .\.venv\Scripts\pyside6-qmllint.exe ui\qml\DevelopmentTree.qml

      - name: Upload scheduled visual audit screenshots
        if: ${{ always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ui-audit-python-${{ matrix.python-version }}
          path: |
            ${{ runner.temp }}\scidev-ui-shots
            ${{ runner.temp }}\scidev-ui-shots-125dpi
          if-no-files-found: ignore
          retention-days: 7
