name: Windows CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * 1"

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Create project environment
        run: python -m venv .venv

      - name: Install dependencies
        run: |
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -r requirements.txt
          .\.venv\Scripts\python.exe -m pip install -r requirements-dev.txt

      - name: Lint with ruff
        run: .\.venv\Scripts\python.exe -m ruff check

      - name: Type-check the typed modules
        run: .\.venv\Scripts\python.exe -m mypy

      - name: Verify minimal Qt runtime
        run: .\.venv\Scripts\python.exe scripts\verify_minimal_qt.py

      - name: Verify the Windows launcher preflight
        run: .\start_client.bat --check-runtime

      - name: Run tests with coverage
        id: tests
        run: .\.venv\Scripts\python.exe scripts\run_tests_coverage.py

      - name: Report test failures as annotations
        if: ${{ failure() && steps.tests.outcome == 'failure' }}
        shell: pwsh
        run: |
          $path = ".research/test_result.json"
          if (-not (Test-Path $path)) {
            Write-Output "::error::Test result file missing; the test child crashed before recording progress."
            exit 0
          }
          $payload = Get-Content $path -Raw | ConvertFrom-Json
          if (-not $payload.complete) {
            Write-Output "::error::Test run aborted after $($payload.last_test)"
          }
          foreach ($item in @($payload.failure_details)) {
            $detail = ([string]$item.detail) -replace "`r?`n", " "
            Write-Output "::error title=$($item.test)::$($item.test) :: $detail"
          }
          if ($payload.complete -and $payload.failures -eq 0 -and $payload.errors -eq 0) {
            Write-Output "::error::Tests passed; the coverage gate or a later step failed."
          }

      - name: Compile Python modules
        shell: pwsh
        run: |
          $targets = @(
            Get-ChildItem -LiteralPath $PWD -Filter "scidev_*.py" -File
            Get-ChildItem -LiteralPath (Join-Path $PWD "tests") -Filter "*.py" -File
            Get-ChildItem -LiteralPath (Join-Path $PWD "scripts") -Filter "*.py" -File
            Get-Item -LiteralPath (Join-Path $PWD "smoke_dependency.py")
            Get-Item -LiteralPath (Join-Path $PWD "smoke_screenshot.py")
          ) | ForEach-Object { $_.FullName }
          & .\.venv\Scripts\python.exe -m py_compile @targets

      - name: Check installed dependencies
        run: .\.venv\Scripts\python.exe -m pip check

      - name: Smoke-test dependencies
        run: .\.venv\Scripts\python.exe smoke_dependency.py

      - name: Render IDE and version-tree layouts
        run: .\.venv\Scripts\python.exe smoke_screenshot.py --output-dir "$env:RUNNER_TEMP\scidev-ui-shots"

      - name: Render IDE layouts at 125% DPI scale
        env:
          QT_SCALE_FACTOR: "1.25"
        run: .\.venv\Scripts\python.exe smoke_screenshot.py --output-dir "$env:RUNNER_TEMP\scidev-ui-shots-125dpi"

      - name: Lint QML
        run: .\.venv\Scripts\pyside6-qmllint.exe ui\qml\DevelopmentTree.qml

      - name: Upload scheduled visual audit screenshots
        if: ${{ always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-audit-python-${{ matrix.python-version }}
          path: |
            ${{ runner.temp }}\scidev-ui-shots
            ${{ runner.temp }}\scidev-ui-shots-125dpi
          if-no-files-found: ignore
          retention-days: 7
