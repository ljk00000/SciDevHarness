name: C# Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  actions: read

jobs:
  package:
    uses: ./.github/workflows/csharp-preview-package.yml

  publish:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download the verified installer artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release-assets
          gh run download "$GITHUB_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name scidevharness-csharp-installer \
            --dir release-assets
          cd release-assets
          sha256sum "SciDevHarness-CSharp-Preview-Setup-${GITHUB_REF_NAME#v}.exe" > SHA256SUMS.txt

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release-assets/SciDevHarness-CSharp-Preview-Setup-*.exe \
            release-assets/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "SciDevHarness $GITHUB_REF_NAME · C# for Windows" \
            --notes "Default C# desktop and CLI for Windows x64. The self-contained installer is unsigned. Docker is optional and used for isolated command execution." \
            --generate-notes \
            --latest \
            --verify-tag
